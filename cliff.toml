# git-cliff configuration, see https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to `@janispritzkau/tailwindcss-material-symbols` are documented in this file.
The changelog is generated from the commit history with [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/janispritzkau/tailwindcss-material-symbols/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/janispritzkau/tailwindcss-material-symbols/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
          {{ commit.message | upper_first }} \
          ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/janispritzkau/tailwindcss-material-symbols/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
# Also keeps the file Prettier-clean: without a footer it ends in a blank line.
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^chore: bump version", skip = true },
  { message = "^release", skip = true },
  # Dependabot's development dependency and GitHub Actions updates don't change the package.
  { message = "^(build\\(deps-dev\\)|ci\\(deps\\))", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^revert", group = "<!-- 5 -->Reverts" },
  { message = "^(chore|build|ci)", group = "<!-- 6 -->Miscellaneous" },
]
filter_commits = false
# Only stable releases on main get their own section.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
