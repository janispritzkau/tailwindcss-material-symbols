version: 2
updates:
  # The pnpm workspace root. Dependabot reads pnpm-workspace.yaml, so this also covers packages/*
  # and examples/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Leaves ranges alone while they allow the new version, so peerDependencies and the published
    # dependency ranges don't change on every release. Exact pins (material-symbols) stay exact.
    versioning-strategy: increase-if-necessary
    labels: [dependencies]
    # Conventional Commits, so the changelog and the release workflow can read the merged updates:
    # `build(deps):` for runtime and `build(deps-dev):` for development dependencies.
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # material-symbols stays ungrouped: one pull request per bump, with its own names diff.
    ignore:
      # The dev copy builds and tests the deprecated v3 plugin (src/v3, the v3 fixtures). Tailwind
      # v4 comes from @tailwindcss/node and the example.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # Matches the oldest Node version CI tests, so the types don't allow newer APIs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      # Majors get their own pull requests, so one of them doesn't hold back the others.
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
