name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the full history and tags to generate release notes.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@janispritzkau"
          cache: "pnpm"
      - run: npm install -g npm@latest
      - run: pnpm install
      - run: pnpm build
      - run: pnpm publish:package
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # cliff.toml only treats stable vX.Y.Z tags as releases, so prereleases
          # get the commits since the last stable release.
          if [[ "$TAG" == *-* ]]; then
            pnpm exec git-cliff --unreleased --tag "$TAG" --strip all --output RELEASE_NOTES.md
            gh release create "$TAG" --verify-tag --prerelease --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            pnpm exec git-cliff --current --strip all --output RELEASE_NOTES.md
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
