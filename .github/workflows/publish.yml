name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the full history and tags to generate release notes.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@janispritzkau"
          cache: "pnpm"
      - run: npm install -g npm@latest
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p 'require("./packages/tailwindcss-material-symbols/package.json").version')
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $TAG doesn't match package.json version $VERSION (expected v$VERSION)."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Prereleases (vX.Y.Z-alpha.N, -beta.N, -rc.N) go to the `next` dist-tag,
          # so `npm install` keeps resolving to the latest stable release.
          if [[ "$TAG" == *-* ]]; then DIST_TAG=next; else DIST_TAG=latest; fi
          echo "Publishing $TAG with dist-tag $DIST_TAG"
          pnpm publish:package --tag "$DIST_TAG"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # cliff.toml only treats stable vX.Y.Z tags as releases, so prereleases
          # get the commits since the last stable release.
          if [[ "$TAG" == *-* ]]; then
            pnpm exec git-cliff --unreleased --tag "$TAG" --strip all --output RELEASE_NOTES.md
            gh release create "$TAG" --verify-tag --prerelease --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            pnpm exec git-cliff --current --strip all --output RELEASE_NOTES.md
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
