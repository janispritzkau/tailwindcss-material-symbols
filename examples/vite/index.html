<!doctype html>
<html lang="en" class="scheme-light-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Material Symbols for Tailwind CSS</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="mx-auto max-w-2xl space-y-8 p-6">
    <h1 class="text-3xl font-bold">Material Symbols for Tailwind CSS</h1>

    <section>
      <h2 class="mb-2 font-semibold">Styles</h2>
      <span class="icon icon-symbol-home"></span>
      <span class="icon icon-rounded icon-symbol-home"></span>
      <span class="icon icon-sharp icon-symbol-home"></span>
    </section>

    <section>
      <h2 class="mb-2 font-semibold">Fill, weight, and grade</h2>
      <span class="icon text-red-600 icon-fill icon-symbol-favorite"></span>
      <span class="icon icon-symbol-search icon-thin"></span>
      <span class="icon icon-bold icon-symbol-search"></span>
      <span class="icon icon-high icon-symbol-settings"></span>
    </section>

    <section>
      <h2 class="mb-2 font-semibold">Sizes</h2>
      <span class="icon icon-sm icon-symbol-star"></span>
      <span class="icon icon-lg icon-symbol-star"></span>
      <span class="icon icon-xl icon-symbol-star"></span>
      <span class="icon icon-8 icon-symbol-star"></span>
      <span class="icon icon-[4em] icon-opsz-xl icon-symbol-star"></span>
      <p class="mt-2 text-sm">
        <span class="icon align-top icon-sm/5 icon-symbol-person"></span>
        Line height from a modifier
      </p>
    </section>

    <section>
      <h2 class="mb-2 font-semibold">Variants</h2>
      <button class="group flex items-center gap-2 rounded border px-3 py-1">
        <span
          class="icon icon-symbol-bookmark group-hover:icon-bold hover:icon-fill dark:icon-on-dark"
        ></span>
        Hover me
      </button>
    </section>

    <section>
      <h2 class="mb-2 font-semibold">Pseudo-elements and codepoints</h2>
      <a
        href="https://fonts.google.com/icons"
        class="underline after:icon after:align-top after:icon-sm/[1lh] after:icon-symbol-open_in_new"
      >
        Google Fonts
      </a>
      <p class="mt-2">
        <span class="icon icon-symbol-2d_2"></span>
        A symbol with a 5-digit codepoint
      </p>
    </section>

    <section>
      <h2 class="mb-2 font-semibold">Shadow DOM</h2>
      <div id="shadow-host"></div>
    </section>
  </body>
</html>
