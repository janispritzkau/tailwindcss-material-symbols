<!doctype html>
<html lang="en" class="scheme-light-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Material Symbols for Tailwind CSS</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="mx-auto max-w-2xl space-y-8 p-6">
    <h1 class="text-3xl font-bold">Material Symbols for Tailwind CSS</h1>

    <section>
      <h2 class="mb-2 font-semibold">Styles</h2>
      <span class="icon icon-symbol-home"></span>
      <span class="icon icon-symbol-home icon-rounded"></span>
      <span class="icon icon-symbol-home icon-sharp"></span>
    </section>

    <section>
      <h2 class="mb-2 font-semibold">Fill, weight, and grade</h2>
      <span class="icon icon-symbol-favorite icon-fill text-red-600"></span>
      <span class="icon icon-symbol-search icon-thin"></span>
      <span class="icon icon-symbol-search icon-bold"></span>
      <span class="icon icon-symbol-settings icon-high"></span>
    </section>

    <section>
      <h2 class="mb-2 font-semibold">Sizes</h2>
      <span class="icon icon-symbol-star icon-sm"></span>
      <span class="icon icon-symbol-star icon-lg"></span>
      <span class="icon icon-symbol-star icon-xl"></span>
      <span class="icon icon-symbol-star icon-8"></span>
      <span class="icon icon-symbol-star icon-[4em] icon-opsz-xl"></span>
      <p class="mt-2 text-sm">
        <span class="icon icon-symbol-person icon-sm/5 align-top"></span>
        Line height from a modifier
      </p>
    </section>

    <section>
      <h2 class="mb-2 font-semibold">Variants</h2>
      <button class="group flex items-center gap-2 rounded border px-3 py-1">
        <span
          class="icon icon-symbol-bookmark hover:icon-fill group-hover:icon-bold dark:icon-on-dark"
        ></span>
        Hover me
      </button>
    </section>

    <section>
      <h2 class="mb-2 font-semibold">Pseudo-elements and codepoints</h2>
      <a
        href="https://fonts.google.com/icons"
        class="after:icon after:icon-symbol-open_in_new after:icon-sm/[1lh] underline after:align-top"
      >
        Google Fonts
      </a>
      <p class="mt-2">
        <span class="icon icon-symbol-2d_2"></span>
        A symbol with a 5-digit codepoint
      </p>
    </section>

    <section>
      <h2 class="mb-2 font-semibold">Shadow DOM</h2>
      <div id="shadow-host"></div>
    </section>
  </body>
</html>
